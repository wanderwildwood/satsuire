[versions]
# Versions mirror the other Kompakt apps rather than the newest available, so this app builds
# against the same Compose/MMD combination that is known to work on the Kompakt.
agp = "8.13.1"
kotlin = "2.2.21"
mmd = "1.0.2"

androidx-activity = "1.12.0"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-compose = "1.9.5"
androidx-material3 = "1.4.0"
androidx-material-icons = "1.7.8"

# Catima's own choices for the parts kept from it: the barcode library, the camera
# scanner over it, and the readers for the files it imports and writes.
zxing-core = "3.5.4"
zxing-embedded = "4.3.0"
commons-csv = "1.9.0"
zip4j = "2.11.6"

junit = "4.13.2"
robolectric = "4.16"
androidx-test-core = "1.7.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "androidx-material-icons" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }

mmd = { module = "com.mudita:MMD", version.ref = "mmd" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
